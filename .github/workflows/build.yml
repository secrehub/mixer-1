name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Asli
      uses: actions/checkout@v4

    - name: Pasang Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Aktifkan Fitur AndroidX
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    - name: Bersihkan Kode Bentrok
      run: |
        sed -i '/buildFlowServiceProperty/d' build.gradle.kts || true
        find . -name "build.gradle.kts" -exec sed -i '/buildFlowServiceProperty/d' {} + || true

    - name: Pasang Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Buat Wrapper 8.2
      run: gradle wrapper --gradle-version 8.2

    - name: Rakit APK Sekarang
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Mixer-Sukses
        path: app/build/outputs/apk/debug/app-debug.apk
