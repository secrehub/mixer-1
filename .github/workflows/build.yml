name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Asli
      uses: actions/checkout@v4

    - name: Pasang Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Alat Perakit Khusus (Gradle 8.0)
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
        unzip -q gradle-8.0-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-8.0/bin" >> $GITHUB_PATH

    - name: Perbaiki Kode Cacat Secara Otomatis
      run: |
        sed -i '/buildFlowServiceProperty/d' build.gradle.kts || true
        find . -name "build.gradle.kts" -exec sed -i '/buildFlowServiceProperty/d' {} + || true

    - name: Rakit APK Sekarang
      run: gradle assembleDebug --no-daemon

    - name: Upload Hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Mixer-Sukses
        path: app/build/outputs/apk/debug/app-debug.apk
