name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Buat Gradle Wrapper Otomatis
      run: gradle wrapper --gradle-version 8.2

    - name: Beri Izin Eksekusi Wrapper
      run: chmod +x gradlew

    - name: Build APK Sekarang
      run: ./gradlew assembleDebug

    - name: Upload Hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Mixer-Sukses
        path: app/build/outputs/apk/debug/app-debug.apk
